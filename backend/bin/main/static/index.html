<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oreo AI Tutor — Live Backend Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Marked.js for rendering markdown output -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #161b22;
      --border: rgba(255,255,255,0.1);
      --blue: #3776ab;
      --yellow: #ffd43b;
      --green: #39d353;
      --text: #f0f6fc;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(55,118,171,0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255,212,59,0.1) 0%, transparent 40%);
    }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.5rem;
      background: rgba(13,17,23,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 0.6rem; }
    .brand i { color: var(--yellow); font-size: 1.5rem; }

    .status-row { display: flex; align-items: center; gap: 1.5rem; }
    .server-pill {
      display: flex; align-items: center; gap: 0.5rem;
      background: rgba(57,211,83,0.1); border: 1px solid rgba(57,211,83,0.3);
      padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; color: var(--green); font-weight: 600;
    }
    .server-pill .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

    .diff-ctrl { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--muted); }
    .diff-ctrl input { accent-color: var(--yellow); width: 80px; cursor: pointer; }
    .diff-badge { background: rgba(255,212,59,0.15); color: var(--yellow); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; border: 1px solid rgba(255,212,59,0.3); }

    /* Layout */
    .workspace { flex: 1; display: flex; padding: 1rem; gap: 1rem; overflow: hidden; }

    /* Video + Canvas Column */
    .main-col { flex: 1; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }

    /* Video player */
    .video-card {
      background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; position: relative;
    }
    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .video-info { padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .video-info h3 { font-size: 0.95rem; font-weight: 600; }
    .pause-ask-btn {
      background: linear-gradient(135deg, var(--blue), #00b4d8);
      border: none; color: #fff; padding: 0.5rem 1rem; border-radius: 20px;
      font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
      transition: transform 0.2s;
    }
    .pause-ask-btn:hover { transform: scale(1.05); }

    /* Canvas area */
    .canvas-card {
      flex: 1; background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; min-height: 250px;
    }
    .canvas-header {
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;
    }
    .canvas-header .label { color: var(--yellow); font-weight: 600; }
    .clear-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
      padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.75rem; cursor: pointer;
    }
    .canvas-body { flex: 1; position: relative; padding: 1rem; overflow-y: auto; background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 20px 20px; }
    .canvas-body canvas { position: absolute; top:0; left:0; width: 100%; height: 100%; cursor: crosshair; pointer-events: auto; }
    #aiExplanationText {
      position: relative; z-index: 2;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: var(--text);
      line-height: 1.6; pointer-events: none;
      background: rgba(10, 12, 16, 0.75); backdrop-filter: blur(8px);
      padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border);
    }
    #aiExplanationText h1, #aiExplanationText h2, #aiExplanationText h3 { color: var(--yellow); margin-top: 0.5rem; margin-bottom: 0.3rem; }
    #aiExplanationText code { font-family: 'Fira Code', monospace; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: #39d353; }
    #aiExplanationText pre { background: #0d1117; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin: 0.5rem 0; }
    #aiExplanationText pre code { background: none; padding: 0; }
    #aiExplanationText ul, #aiExplanationText ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    #aiExplanationText p { margin-bottom: 0.5rem; }

    /* Chat Panel */
    .chat-panel {
      width: 420px; background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .chat-header i { color: var(--blue); }

    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .msg { max-width: 92%; padding: 0.8rem 1.1rem; border-radius: 14px; font-size: 0.9rem; line-height: 1.5; }
    .msg.ai { align-self: flex-start; background: rgba(55,118,171,0.15); border: 1px solid rgba(55,118,171,0.3); border-bottom-left-radius: 4px; }
    .msg.ai h1, .msg.ai h2, .msg.ai h3 { color: var(--yellow); font-size: 1rem; margin-top: 0.4rem; margin-bottom: 0.2rem; }
    .msg.ai code { font-family: 'Fira Code', monospace; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; color: var(--green); font-size: 0.82rem; }
    .msg.ai pre { background: #0d1117; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin: 0.4rem 0; }
    .msg.ai pre code { background: none; padding: 0; }
    .msg.ai ul, .msg.ai ol { padding-left: 1.2rem; margin: 0.4rem 0; }
    .msg.ai p { margin-bottom: 0.4rem; }
    .msg.ai p:last-child { margin-bottom: 0; }

    .msg.user { align-self: flex-end; background: rgba(255,212,59,0.12); border: 1px solid rgba(255,212,59,0.25); border-bottom-right-radius: 4px; }
    .msg.system { align-self: center; background: rgba(57,211,83,0.1); border: 1px solid rgba(57,211,83,0.2); color: var(--green); font-size: 0.8rem; text-align: center; border-radius: 10px; }
    .msg.error { align-self: center; background: rgba(255,85,85,0.1); border: 1px solid rgba(255,85,85,0.3); color: #ff5555; font-size: 0.8rem; text-align: center; }

    .typing-indicator { align-self: flex-start; padding: 0.5rem 1rem; font-size: 0.8rem; color: var(--muted); display: none; }
    .typing-indicator.visible { display: block; }

    .chip-row { padding: 0.5rem 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    .chip {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--yellow);
      padding: 0.3rem 0.7rem; border-radius: 12px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { background: rgba(55,118,171,0.2); border-color: var(--blue); }

    .chat-input { display: flex; gap: 0.5rem; padding: 0.8rem 1rem; border-top: 1px solid var(--border); background: rgba(13,17,23,0.8); }
    .chat-input input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.6rem 0.8rem; color: #fff; font-size: 0.85rem; outline: none;
    }
    .chat-input input:focus { border-color: var(--blue); }
    .send-btn {
      background: linear-gradient(135deg, var(--blue), #00b4d8); border: none; color: #fff;
      padding: 0 1rem; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="brand"><i class="fa-brands fa-python"></i> Oreo AI Tutor — Python OOPs Live Test</div>
  <div class="status-row">
    <div class="diff-ctrl">
      Difficulty:
      <input type="range" min="1" max="5" value="3" id="diffSlider" oninput="updateDiff(this.value)">
      <span class="diff-badge" id="diffBadge">3 — Standard</span>
    </div>
    <div class="server-pill"><div class="dot"></div> <span id="serverLabel">Checking...</span></div>
  </div>
</header>

<div class="workspace">
  <!-- Left: Video + Canvas -->
  <div class="main-col">
    <div class="video-card">
      <div class="video-container">
        <!-- Using standard YouTube iframe with origin parameter to fix Error 153 -->
        <iframe id="ytPlayer" src="https://www.youtube-nocookie.com/embed/JeznW_7DlB0?enablejsapi=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <h3><i class="fa-brands fa-python" style="color:#ffd43b;margin-right:6px;"></i> Python Object-Oriented Programming (OOP) - For Beginners</h3>
        <button class="pause-ask-btn" onclick="pauseAndAsk()"><i class="fa-solid fa-wand-magic-sparkles"></i> Pause & Ask AI</button>
      </div>
                <label class="block text-sm font-medium mb-1">Language:</label>
                <select id="langSelect" class="w-full rounded p-2 bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-blue-500">
                    <option value="en">English (Default)</option>
                    <option value="hi" selected>Hindi (हिन्दी)</option>
                    <option value="ta">Tamil (தமிழ்)</option>
                    <option value="te">Telugu (తెలుగు)</option>
                    <option value="mr">Marathi (मराठी)</option>
                    <option value="bn">Bengali (বাংলা)</option>
                </select>
    </div>
    <div class="canvas-card">
      <div class="canvas-header">
        <span class="label"><i class="fa-solid fa-chalkboard"></i> AI Whiteboard Canvas</span>
        <button class="clear-btn" onclick="clearCanvas()"><i class="fa-solid fa-eraser"></i> Clear</button>
      </div>
      <div class="canvas-body">
        <canvas id="drawCanvas"></canvas>
        <div id="aiExplanationText"></div>
      </div>
    </div>
  </div>

  <!-- Right: Chat Panel -->
  <div class="chat-panel">
    <div class="chat-header"><i class="fa-solid fa-robot"></i> Gemini AI Tutor Chat (Live API)</div>
    <div class="chat-messages" id="chatBox">
      <div class="msg system">Connected to Spring Boot backend! Gemini AI is ready.</div>
    </div>
    <div class="typing-indicator" id="typingInd"><i class="fa-solid fa-circle-notch fa-spin"></i> Gemini is thinking...</div>
    <div class="chip-row">
      <button class="chip" onclick="sendPreset('What is __init__ and self in Python classes?')">__init__ & self</button>
      <button class="chip" onclick="sendPreset('Explain inheritance in Python OOP with a code example')">Inheritance</button>
      <button class="chip" onclick="sendPreset('What is polymorphism and how is it used in Python?')">Polymorphism</button>
      <button class="chip" onclick="sendPreset('What is the difference between a class variable and an instance variable?')">Class vs Instance Var</button>
      <button class="chip" onclick="sendPreset('Explain encapsulation and private attributes in Python')">Encapsulation</button>
    </div>
    <form class="chat-input" onsubmit="handleSubmit(event)">
      <input type="text" id="userInput" placeholder="Type your Python OOP doubt..." autocomplete="off">
      <button type="submit" class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>
</div>

<script>
  const BACKEND = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:8080';
  let difficulty = 3;

  // Configure Marked.js for clean sanitization & parsing
  marked.setOptions({
    gfm: true,
    breaks: true
  });

  // --- Health Check ---
  async function checkHealth() {
    const label = document.getElementById('serverLabel');
    try {
      const r = await fetch(BACKEND + '/actuator/health');
      label.textContent = r.ok ? 'Backend UP ✓' : 'Backend DOWN';
    } catch (e) {
      label.textContent = 'Backend OFFLINE';
    }
  }
  checkHealth();

  // --- Difficulty ---
  function updateDiff(v) {
    difficulty = parseInt(v);
    const labels = ['1 — ELI5','2 — Simple','3 — Standard','4 — Advanced','5 — Expert'];
    document.getElementById('diffBadge').textContent = labels[v-1];
  }

  // --- Chat ---
  function addMsg(role, content) {
    const box = document.getElementById('chatBox');
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    
    if (role === 'ai') {
      // Parse markdown cleanly into sanitized HTML!
      d.innerHTML = marked.parse(content);
    } else {
      d.textContent = content;
    }
    
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function sendPreset(text) {
    document.getElementById('userInput').value = text;
    handleSubmit(new Event('submit'));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('userInput');
    const doubt = input.value.trim();
    if (!doubt) return;

    addMsg('user', doubt);
    input.value = '';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('typingInd').classList.add('visible');

    clearCanvas();

    const pythonTranscript = "In Python, Object-Oriented Programming (OOP) allows you to model real-world entities using classes and objects. A class defines a blueprint. The __init__ method is the constructor that initializes instance attributes. The self parameter refers to the current object instance. Inheritance allows one class to derive from another. Polymorphism means the same method name can behave differently based on the object calling it. Encapsulation bundles data and methods together and restricts direct access to some attributes using underscores.";

    try {
      const resp = await fetch(BACKEND + '/api/orchestration/canvas-explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          doubt: doubt,
          transcript: pythonTranscript,
          difficultyLevel: difficulty
        })
      });

      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      const explanation = data.payload?.explanation || JSON.stringify(data);

      addMsg('ai', explanation);
      renderOnCanvas(explanation);

    } catch (err) {
      addMsg('error', 'API Error: ' + err.message + '. Is the backend running?');
    } finally {
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('typingInd').classList.remove('visible');
    }
  }

  // --- Canvas ---
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;

  function resizeCanvas() {
    const p = canvas.parentElement;
    canvas.width = p.clientWidth;
    canvas.height = p.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 200);

  canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
  });
  canvas.addEventListener('mouseup', () => drawing = false);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('aiExplanationText').innerHTML = '';
  }

  function renderOnCanvas(text) {
    // Render sanitized markdown on canvas text box!
    document.getElementById('aiExplanationText').innerHTML = marked.parse(text);
  }

  // --- Pause YouTube & Ask ---
  function pauseAndAsk() {
    const iframe = document.getElementById('ytPlayer');
    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    document.getElementById('userInput').focus();
  }
</script>
</body>
</html>
