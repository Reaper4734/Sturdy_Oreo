version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oreo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oreo_db
    ports:
      - "5432:5432"
    volumes:
      - oreo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  oreo_postgres_data:
